services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────── #
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB:       sewasetu
      POSTGRES_USER:     sewasetu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sewasetu123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sewasetu"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not exposed to host — only reachable by other containers on the docker network

  # ── SMS gateway ─────────────────────────────────────────────────────────── #
  smsgw:
    build: ./smsgw
    restart: unless-stopped
    expose:
      - "8025"
    # Not exposed to host — routed via the portal's /__gateway/ proxy

  # ── Flask portal + OAuth 2.1 authorization server ──────────────────────── #
  app:
    build: ./app
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY:      ${SECRET_KEY:-ssp-dev-key-change-me}
      ADMIN_USERNAME:  ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:  ${ADMIN_PASSWORD:-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      # Tell Flask it sits behind Caddy (which sits behind Cloudflare):
      # ProxyFix reads X-Forwarded-Proto so url_for() builds https:// URLs.
      BEHIND_PROXY:    ${BEHIND_PROXY:-0}
      DB_HOST:         db
      DB_PORT:         "5432"
      DB_NAME:         sewasetu
      DB_USER:         sewasetu
      DB_PASSWORD:     ${DB_PASSWORD:-sewasetu123}
    depends_on:
      db:
        condition: service_healthy
      smsgw:
        condition: service_started
    volumes:
      - ./app:/app
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Nightly deemed-approval cron ───────────────────────────────────────── #
  scheduler:
    build: ./app
    restart: unless-stopped
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      DB_HOST:        db
      DB_PORT:        "5432"
      DB_NAME:        sewasetu
      DB_USER:        sewasetu
      DB_PASSWORD:    ${DB_PASSWORD:-sewasetu123}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app
      - applogs:/var/log/sewasetu

  # ── Citizen MCP — port 8001 ─────────────────────────────────────────────── #
  citizen_mcp:
    build: ./mcp
    restart: unless-stopped
    command: ["sh", "-c", "mkdir -p /var/sewasetu/uploads/.tmp && python citizen_mcp.py"]
    expose:
      - "8001"
    ports:
      - "8001:8001"
    environment:
      # Database
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_NAME:     sewasetu
      DB_USER:     sewasetu
      DB_PASSWORD: ${DB_PASSWORD:-sewasetu123}
      # SMS
      SMS_GATEWAY_URL:      http://smsgw:8025
      OTP_VALIDITY_SECONDS: "300"
      # OAuth — PORTAL_ISSUER = public https:// URL (stamped in JWT `iss`)
      #         PORTAL_JWKS_URL = internal container URL (fetched inside Docker net)
      PORTAL_ISSUER:   ${PUBLIC_BASE_URL:-http://localhost}
      PORTAL_JWKS_URL: http://app:8000/.well-known/jwks.json
      CITIZEN_MCP_URL: ${CITIZEN_MCP_URL:-http://localhost/mcp/citizen}
      OFFICER_MCP_URL: ${OFFICER_MCP_URL:-http://localhost/mcp/officer}
      # Scheme
      MIN_AGE:         "60"
      SLA_DAYS:        "15"
      SCHEME_DEADLINE: "2026-10-31 23:59"
      AGENT_BLOCKS:    ${AGENT_BLOCKS:-Sonari,Rajapara,Dhemaji Pathar}
      # Server binding
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8001"
      # Dev bypass — MUST be empty in production
      DEV_INSECURE_MOBILE: ${DEV_INSECURE_MOBILE:-}
      # Logging + uploads
      LOG_FORMAT:          ${LOG_FORMAT:-json}
      UPLOAD_ROOT:         /var/sewasetu/uploads
      TEMP_ROOT:           /var/sewasetu/uploads/.tmp
      MAX_FILE_SIZE_BYTES: "5242880"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./mcp:/app
      - mcp_data:/app/data
      - uploads:/var/sewasetu/uploads
    healthcheck:
      # A GET / without a token should return 401 (auth required) — that means the server is up.
      # Exit code 0 if the response is 401 or 200, non-zero otherwise.
      test: ["CMD-SHELL",
        "python -c \"import urllib.request,sys; r=urllib.request.urlopen(urllib.request.Request('http://localhost:8001/', method='POST', data=b'{}'), timeout=5); sys.exit(0)\" 2>/dev/null; [ $? -eq 0 ] || python -c \"import urllib.request,urllib.error,sys; urllib.request.urlopen('http://localhost:8001/',timeout=5)\" 2>/dev/null; exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Officer MCP — port 8002 ─────────────────────────────────────────────── #
  officer_mcp:
    build: ./mcp
    restart: unless-stopped
    command: ["python", "officer_mcp.py"]
    expose:
      - "8002"
    ports:
      - "8002:8002"
    environment:
      # Database
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_NAME:     sewasetu
      DB_USER:     sewasetu
      DB_PASSWORD: ${DB_PASSWORD:-sewasetu123}
      # OAuth
      PORTAL_ISSUER:   ${PUBLIC_BASE_URL:-http://localhost}
      PORTAL_JWKS_URL: http://app:8000/.well-known/jwks.json
      CITIZEN_MCP_URL: ${CITIZEN_MCP_URL:-http://localhost/mcp/citizen}
      OFFICER_MCP_URL: ${OFFICER_MCP_URL:-http://localhost/mcp/officer}
      # Scheme
      MIN_AGE:      "60"
      SLA_DAYS:     "15"
      AGENT_BLOCKS: ${AGENT_BLOCKS:-Sonari,Rajapara,Dhemaji Pathar}
      # Server binding
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8002"
      # Dev bypass — MUST be empty in production
      DEV_INSECURE_OFFICER: ${DEV_INSECURE_OFFICER:-}
      # Logging
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    volumes:
      - ./mcp:/app
      - mcp_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:8002/',timeout=5)\" 2>/dev/null; exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Caddy: reverse proxy (TLS is terminated by Cloudflare, not here) ──────  #
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # 443 is not needed when Cloudflare terminates TLS in Full/Full(Strict) mode.
      # If you switch to direct TLS (no Cloudflare proxy), uncomment the line below
      # and change Caddyfile to use auto_https on + your domain.
      # - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - citizen_mcp
      - officer_mcp

volumes:
  pgdata:
  uploads:
  applogs:
  mcp_data:
  caddy_data:
  caddy_config:
