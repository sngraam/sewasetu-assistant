; Sewa Setu configuration
; All sensitive values (secret_key, DB password) are overridden by env vars set
; in docker-compose.yml / .env — do NOT store real secrets in this file.
; This file provides non-sensitive defaults for local development only.

[database]
host = db
port = 5432
name = sewasetu
user = sewasetu
; Overridden in production by DB_PASSWORD env var via get_db()
password = sewasetu123

[app]
; Overridden in production by SECRET_KEY env var
secret_key = dev-insecure-key-change-in-production
sms_gateway_url = http://smsgw:8025
otp_validity_seconds = 300
upload_dir = /var/sewasetu/uploads

[pension]
min_age = 60
sla_days = 15
scheme_deadline = 2026-10-31 23:59
